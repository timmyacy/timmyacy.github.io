<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
  // GitHub Pages serves this for any path that isn't a real static file.
  // This site uses hash-based routing, so /admin should really be
  // /#/admin. Redirect instead of dead-ending here.
  var path = location.pathname.replace(/^\//, '');
  location.replace('/#/' + path + location.search);
</script>
</head>
