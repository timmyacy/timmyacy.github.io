<div id="data" class="section-label">
  <span>FREE DATASETS</span>
  <span>updated daily</span>
</div>

<div class="ds-grid">
  <div class="ds-cell" *ngFor="let d of datasets">
    <div class="cat">{{ d.category }}</div>
    <div class="count">{{ d.count }}</div>
    <span class="tag">{{ d.tag }}</span>
  </div>
</div>
