<app-project-demo-shell
  title="Jump-Diffusion Pricer"
  tagline="Merton (1976) closed-form jump-diffusion pricing, a Poisson-weighted mixture of Black-Scholes prices. The repo's C++ engine also runs a Carr-Madan FFT pricer for Variance Gamma and checks it against Monte Carlo. This page just runs the semi-analytic series live."
  [repoUrl]="repoUrl"
>
  <div class="calc">
    <div class="calc-form">
      <label>Spot</label>
      <input type="number" [(ngModel)]="spot" step="0.5">

      <label>Strike</label>
      <input type="number" [(ngModel)]="strike" step="0.5">

      <label>Maturity (years)</label>
      <input type="number" [(ngModel)]="maturity" step="0.05">

      <label>Rate (%)</label>
      <input type="number" [(ngModel)]="ratePct" step="0.1">

      <label>Diffusion vol (%)</label>
      <input type="number" [(ngModel)]="volPct" step="0.5">

      <label>Jump intensity λ (per year)</label>
      <input type="number" [(ngModel)]="jumpIntensity" step="0.1">

      <label>Mean jump size (%)</label>
      <input type="number" [(ngModel)]="jumpMeanPct" step="0.5">

      <label>Jump volatility (%)</label>
      <input type="number" [(ngModel)]="jumpVolPct" step="0.5">
    </div>

    <div class="calc-result">
      <div class="price-row">
        <div class="price-block">
          <div class="lbl">JUMP-DIFFUSION PRICE (call)</div>
          <div class="price">{{ merton.price | number: '1.2-2' }}</div>
        </div>
        <div class="price-block secondary">
          <div class="lbl">PLAIN BSM PRICE</div>
          <div class="price small">{{ plainBsmPrice | number: '1.2-2' }}</div>
        </div>
        <div class="price-block secondary">
          <div class="lbl">JUMP RISK PREMIUM</div>
          <div class="price small" [class.up]="jumpRiskPremium >= 0" [class.down]="jumpRiskPremium < 0">
            {{ jumpRiskPremium >= 0 ? '+' : '' }}{{ jumpRiskPremium | number: '1.2-2' }}
          </div>
        </div>
      </div>

      <div class="conv-block">
        <div class="lbl">SERIES CONVERGENCE (running price vs. terms included)</div>
        <canvas #conv></canvas>
      </div>
    </div>
  </div>
</app-project-demo-shell>
